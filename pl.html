<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #videoWrap { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    #playBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 14px 28px; font-size: 18px; border-radius: 10px; border: none;
      background: #0a84ff; color: #fff; z-index: 10; font-family: -apple-system, sans-serif;
    }
    #status {
      position: absolute; bottom: 8px; left: 8px; right: 8px; color: #0f0;
      font: 11px/1.4 Menlo, monospace; z-index: 10; word-break: break-all;
    }

    /* Painel de consola visível abaixo do vídeo */
    #consolePanel {
      flex: 0 0 35%; display: flex; flex-direction: column;
      background: #111; border-top: 1px solid #333;
      font-family: Menlo, monospace; font-size: 11px;
    }
    #consoleHeader {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px; background: #1c1c1e; color: #999;
      border-bottom: 1px solid #333;
    }
    #consoleHeader button {
      background: #333; color: #fff; border: none; border-radius: 6px;
      padding: 4px 10px; font-size: 11px;
    }
    #consoleLog { flex: 1; overflow-y: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
    .logLine { white-space: pre-wrap; word-break: break-all; padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
    .logLine.log   { color: #ddd; }
    .logLine.info  { color: #4fc3f7; }
    .logLine.warn  { color: #ffca28; }
    .logLine.error { color: #ff5252; }
    .logTime { color: #666; margin-right: 6px; }
  </style>
  <!-- Em produção, considera fazer bundle local do shaka-player.compiled.js em vez de usar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.0/dist/shaka-player.compiled.js"></script>
</head>
<body>
  <div id="videoWrap">
    <video id="video" playsinline muted disableRemotePlayback></video>
    <button id="playBtn">▶︎ Reproduzir</button>
    <div id="status">a aguardar...</div>
  </div>

  <div id="consolePanel">
    <div id="consoleHeader">
      <span>consola</span>
      <button id="clearConsoleBtn">limpar</button>
    </div>
    <div id="consoleLog"></div>
  </div>

  <script>
    // ---- Captura tudo o que vai para a consola e mostra no painel ----
    (function () {
      const consoleLogEl = document.getElementById('consoleLog');
      const clearBtn = document.getElementById('clearConsoleBtn');

      function append(level, args) {
        const line = document.createElement('div');
        line.className = 'logLine ' + level;
        const time = new Date().toLocaleTimeString();
        const text = args.map((a) => {
          if (a instanceof Error) return a.message;
          if (typeof a === 'object') {
            try { return JSON.stringify(a); } catch (e) { return String(a); }
          }
          return String(a);
        }).join(' ');
        line.innerHTML = '<span class="logTime">' + time + '</span>' + text;
        consoleLogEl.appendChild(line);
        consoleLogEl.scrollTop = consoleLogEl.scrollHeight;
      }

      ['log', 'info', 'warn', 'error'].forEach((level) => {
        const original = console[level].bind(console);
        console[level] = (...args) => {
          original(...args);
          append(level, args);
        };
      });

      window.addEventListener('error', (e) => {
        append('error', ['JS error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')']);
      });
      window.addEventListener('unhandledrejection', (e) => {
        append('error', ['Promise rejeitada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]);
      });

      clearBtn.addEventListener('click', () => { consoleLogEl.innerHTML = ''; });
    })();
  </script>

  <script>
    // ---- CONFIGURA AQUI ----
    const MANIFEST_URL = "https://rr.cdn.vodafone.pt/LIVE/sdash/LIVE$375/index.mpd/Manifest?start=LIVE&end=END&device=DASH_AVC_FULLHD";
    const CLEAR_KEYS = {
      // "keyId em hex (32 chars)": "key em hex (32 chars)"
      "fe592a3582ee48d7b8538dbc3f59215c": "517cc39986fd42f89986dc3aecd7cfa4"
    };
    // -------------------------

    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');

    function log(msg) {
      statusEl.textContent = msg;
      console.log('[player]', msg);
    }

    async function initAndLoad() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        log('Motor sem suporte a MSE/ManagedMediaSource. Requer iOS 17.1+.');
        return;
      }

      const player = new shaka.Player();
      await player.attach(video);

      player.configure({
        drm: {
          clearKeys: CLEAR_KEYS
        },
        streaming: {
          lowLatencyMode: true,
          rebufferingGoal: 0.5,
          bufferingGoal: 6
        }
      });

      player.addEventListener('error', (event) => {
        log('Erro Shaka ' + event.detail.code + ': ' + event.detail.message);
      });

      try {
        log('a carregar manifest...');
        await player.load(MANIFEST_URL);
        log('manifest carregado, a iniciar reprodução...');
        await video.play();
        log('a reproduzir.');
      } catch (e) {
        log('Falha (' + (e.code || '') + '): ' + e.message);
      }
    }

    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      video.muted = false;
      initAndLoad();
    });
  </script>
</body>
</html>
